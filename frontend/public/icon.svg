<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded App Tile -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Glowing Sun -->
  <circle cx="340" cy="180" r="75" fill="url(#sun)" filter="url(#shadow)"/>
  
  <!-- Stylized Cloud -->
  <path d="M160 380 h210 a65 65 0 0 0 10-129 95 95 0 0 0-185-30 65 65 0 0 0-35 159 z" fill="url(#cloud)" filter="url(#shadow)"/>
</svg>
